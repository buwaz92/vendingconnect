# Admin page settings (Sveltia CMS).
# Change YOUR-GITHUB-USERNAME below to your real GitHub username.

backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/vendingconnect
  branch: main

# Where uploaded images go
media_folder: public/uploads
public_folder: /uploads

site_url: https://vendingconnect.com.au
display_url: https://vendingconnect.com.au
logo_url: /favicon.svg

collections:
  - name: guides
    label: Guides
    label_singular: Guide
    description: How-to articles. These are the main posts that bring people in from Google.
    folder: src/content/guides
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "guides/{{slug}}/"
    sortable_fields: [date, title, category]
    summary: "{{title}} — {{category}}"
    fields:
      - { name: title, label: Title, widget: string, hint: "Write it like something people would search, e.g. 'How to start a vending business in Australia'." }
      - { name: description, label: Short description, widget: text, hint: "1–2 sentences, about 150 characters. Shows in Google results and on Facebook shares." }
      - name: category
        label: Category
        widget: select
        options: ["Starting a Business", "Choosing Machines", "Locations", "Repairs & Issues", "Running Your Business"]
      - { name: date, label: Publish date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: updated, label: Last updated, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false, hint: "Set this when you make a big update. Google likes fresh content." }
      - { name: cover, label: Cover image, widget: image, required: false, hint: "Wide image, ideally 1200 × 675 px." }
      - { name: coverAlt, label: Cover image description, widget: string, required: false, hint: "Describe the image in a few words (helps Google and screen readers)." }
      - { name: featured, label: Show on home page, widget: boolean, default: false }
      - { name: draft, label: Draft (hide from site), widget: boolean, default: false }
      - name: faq
        label: FAQ (optional)
        widget: list
        required: false
        hint: "Common questions about this topic. These can show up directly in Google results."
        fields:
          - { name: question, label: Question, widget: string }
          - { name: answer, label: Answer, widget: text }
      - { name: body, label: Article, widget: markdown, hint: "Use 'Heading 2' for main sections. They become the 'On this page' list." }

  - name: news
    label: News
    label_singular: News post
    description: Short updates and announcements.
    folder: src/content/news
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "news/{{slug}}/"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Short description, widget: text, hint: "1–2 sentences. Shows in Google and on Facebook shares." }
      - { name: date, label: Publish date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: coverAlt, label: Cover image description, widget: string, required: false }
      - { name: draft, label: Draft (hide from site), widget: boolean, default: false }
      - { name: body, label: Post, widget: markdown }

  - name: settings
    label: Site Settings
    files:
      - name: settings
        label: Contact details & form
        file: src/data/settings.json
        format: json
        fields:
          - { name: siteName, label: Site name, widget: string }
          - { name: tagline, label: Tagline, widget: text, hint: "Used as the default description on Google." }
          - { name: email, label: Contact email, widget: string, required: false }
          - { name: phone, label: Phone, widget: string, required: false }
          - { name: facebookUrl, label: Facebook page link, widget: string, required: false }
          - { name: web3formsKey, label: Web3Forms access key, widget: string, required: false, hint: "Get a free key at web3forms.com using the email you want enquiries sent to. Leave empty to hide the form." }
